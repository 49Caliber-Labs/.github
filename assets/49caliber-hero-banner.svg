<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#091931" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="tacGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.7" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font: 800 44px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; letter-spacing: 3px; fill: url(#titleGrad); }
      .sub { font: 600 14.5px 'Consolas', 'Courier New', monospace; letter-spacing: 2.2px; fill: #38bdf8; }
      .desc { font: 400 15px 'Segoe UI', -apple-system, Roboto, sans-serif; fill: #94a3b8; }
      .badge-text { font: 700 11.5px 'Consolas', 'Courier New', monospace; letter-spacing: 1px; }
      .hud-label { font: 600 10px 'Consolas', monospace; fill: #64748b; letter-spacing: 1.5px; }
      .hud-val { font: 700 16px 'Consolas', monospace; fill: #f8fafc; }
      @keyframes pulseRing {
        0% { r: 28px; opacity: 0.85; stroke-width: 2px; }
        100% { r: 135px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes pulseRing2 {
        0% { r: 28px; opacity: 0.65; stroke-width: 1.5px; }
        100% { r: 105px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      .ring1 { animation: pulseRing 4.5s cubic-bezier(0.1, 0.6, 0.3, 1) infinite; }
      .ring2 { animation: pulseRing2 4.5s cubic-bezier(0.1, 0.6, 0.3, 1) 2.25s infinite; }
      .wave-line { stroke-dasharray: 12 6; animation: dashFlow 6s linear infinite; }
    </style>
  </defs>

  <!-- Outer Frame & Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2" />
  <rect width="1200" height="340" rx="16" fill="url(#tacGrid)" />

  <!-- Top & Bottom Accent Laser Lines -->
  <rect x="60" y="2" width="1080" height="2" fill="url(#cyanGlow)" />
  <rect x="60" y="336" width="1080" height="2" fill="url(#cyanGlow)" />

  <!-- Right-Side Animated 915 MHz Phased-Array Radar & Isobar Graphic -->
  <g transform="translate(995, 170)">
    <!-- Isobar Concentric Rings -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#1e3a5f" stroke-width="1" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#1e3a5f" stroke-width="1" />

    <!-- Animated Expanding LoRa RF Pulse Rings -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00f2fe" class="ring1" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#10b981" class="ring2" />

    <!-- Mesh Topology Triangles -->
    <polygon points="0,-78 68,42 -62,38" fill="#0ea5e9" fill-opacity="0.07" stroke="#38bdf8" stroke-width="1.2" class="wave-line" />
    <polygon points="-55,-52 75,-25 18,75" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />

    <!-- Mesh Nodes -->
    <circle cx="0" cy="-78" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="10" y="-74" font-family="Consolas, monospace" font-size="10" fill="#10b981">NODE_0xA1</text>

    <circle cx="68" cy="42" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="77" y="46" font-family="Consolas, monospace" font-size="10" fill="#38bdf8">MULE_0xB2</text>

    <circle cx="-62" cy="38" r="5" fill="#f59e0b" filter="url(#glow)" />
    <text x="-128" y="42" font-family="Consolas, monospace" font-size="10" fill="#f59e0b">SAR_PEER</text>

    <!-- Center Core Transceiver Hub -->
    <circle cx="0" cy="0" r="18" fill="#071529" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#00f2fe" />
    <text x="-38" y="152" font-family="Consolas, monospace" font-size="10" fill="#64748b">915 MHz ARRAY</text>
  </g>

  <!-- Left-Side Corporate Identity & Telemetry Readouts -->
  <g transform="translate(56, 52)">
    <!-- Top Tactical Pill -->
    <rect x="0" y="0" width="445" height="26" rx="13" fill="#0c2442" stroke="#0284c7" stroke-width="1" />
    <circle cx="15" cy="13" r="4.5" fill="#10b981" filter="url(#glow)" />
    <text x="28" y="17" class="badge-text" fill="#e0f2fe">CALIFORNIA R&amp;D CORPORATION  •  DUAL-USE RF &amp; HYDROLOGY LAB</text>

    <!-- Main Title -->
    <text x="0" y="78" class="title">49CALIBER LABS, INC.</text>
    <text x="2" y="106" class="sub">APPLIED RF TELEMETRY  //  DELAY-TOLERANT MESH  //  ENVIRONMENTAL PHYSICS</text>

    <!-- Mission Statement -->
    <text x="2" y="140" class="desc">Engineering deterministic 32-byte sub-GHz LoRa wire protocols, distributed barometric phased-array</text>
    <text x="2" y="162" class="desc">nowcasting (∇P), GPS-denied canyon Search &amp; Rescue trilateration, and nationwide hydrological intelligence.</text>

    <!-- 4 Telemetry HUD Cards -->
    <g transform="translate(0, 190)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="185" height="64" rx="8" fill="#071326" stroke="#1e3a5f" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#10b981" />
      <text x="16" y="22" class="hud-label">OPEN-SOURCE CORE</text>
      <text x="16" y="45" class="hud-val" fill="#10b981">MeshMule-Core</text>

      <!-- Card 2 -->
      <rect x="200" y="0" width="195" height="64" rx="8" fill="#071326" stroke="#1e3a5f" stroke-width="1.2" />
      <rect x="200" y="0" width="4" height="64" rx="2" fill="#00f2fe" />
      <text x="216" y="22" class="hud-label">COMMERCIAL PLATFORM</text>
      <text x="216" y="45" class="hud-val" fill="#38bdf8">BiteWindow V7</text>

      <!-- Card 3 -->
      <rect x="410" y="0" width="185" height="64" rx="8" fill="#071326" stroke="#1e3a5f" stroke-width="1.2" />
      <rect x="410" y="0" width="4" height="64" rx="2" fill="#f59e0b" />
      <text x="426" y="22" class="hud-label">WIRE PROTOCOL</text>
      <text x="426" y="45" class="hud-val" fill="#fbbf24">32-Byte 0xA1/0xB2</text>

      <!-- Card 4 -->
      <rect x="610" y="0" width="195" height="64" rx="8" fill="#071326" stroke="#1e3a5f" stroke-width="1.2" />
      <rect x="610" y="0" width="4" height="64" rx="2" fill="#a855f7" />
      <text x="626" y="22" class="hud-label">HYDROGRAPHIC INDEX</text>
      <text x="626" y="45" class="hud-val" fill="#c084fc">34,651 Waterways</text>
    </g>
  </g>
</svg>
